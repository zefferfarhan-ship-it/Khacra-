<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kharcha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: passbook. A ruled-ledger hero with a torn stub, one scrolling column on phones, left rail plus two columns on desktop.
   Colour: indigo ink on cool paper, one highlighter yellow for the thing that matters. Category hues come from a validated palette. */
:root{
  --bg:#ECEEF6; --surface:#FFFFFF; --surface-2:#F3F4FA; --ink:#10143B; --ink-2:#464C73; --ink-3:#6F76A0; --line:#DADDEC;
  --accent:#3A38E8; --accent-ink:#FFFFFF; --accent-soft:#E6E6FF;
  --deep:#14185A; --deep-ink:#FFFFFF; --hl:#FFD84A; --hl-ink:#10143B;
  --good:#006300; --good-soft:#DDF3E2; --warn:#8A5A00; --warn-soft:#FFEFC9; --bad:#C42B38; --bad-soft:#FFE2E4;
  --c-housing:#2a78d6; --c-dining:#eb6834; --c-groceries:#1baf7a; --c-shopping:#eda100; --c-fun:#e87ba4;
  --c-transport:#008300; --c-bills:#6250d6; --c-health:#e34948; --c-other:#898781;
  --f-display:'Bricolage Grotesque','Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-md:16px; --r-lg:24px; --shadow:0 1px 2px rgba(16,20,59,.06),0 8px 24px rgba(16,20,59,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0D24; --surface:#131839; --surface-2:#1B2149; --ink:#EEF0FF; --ink-2:#B4BADC; --ink-3:#8A91B8; --line:#262D5C;
    --accent:#9194FF; --accent-ink:#0A0D24; --accent-soft:#242A72;
    --deep:#1B2178; --good:#3DD6A0; --good-soft:#0F3A2D; --warn:#F2B84B; --warn-soft:#3D2E0C; --bad:#FF7A84; --bad-soft:#43151B;
    --c-housing:#3987e5; --c-dining:#d95926; --c-groceries:#199e70; --c-shopping:#c98500; --c-fun:#d55181;
    --c-transport:#008300; --c-bills:#9085e9; --c-health:#e66767; --c-other:#898781;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0D24; --surface:#131839; --surface-2:#1B2149; --ink:#EEF0FF; --ink-2:#B4BADC; --ink-3:#8A91B8; --line:#262D5C;
  --accent:#9194FF; --accent-ink:#0A0D24; --accent-soft:#242A72;
  --deep:#1B2178; --good:#3DD6A0; --good-soft:#0F3A2D; --warn:#F2B84B; --warn-soft:#3D2E0C; --bad:#FF7A84; --bad-soft:#43151B;
  --c-housing:#3987e5; --c-dining:#d95926; --c-groceries:#199e70; --c-shopping:#c98500; --c-fun:#d55181;
  --c-transport:#008300; --c-bills:#9085e9; --c-health:#e66767; --c-other:#898781;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;margin:0}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(150px + env(safe-area-inset-bottom,0px))}
.col{min-width:0}
.rail{display:contents}
.rail .brand,.rail .rail-note{display:none}
.top{display:flex;align-items:center;gap:10px;padding-block:8px 16px}
.top .mark{width:38px;height:38px;flex:none}
.top .ttl{flex:1;min-width:0}
.eyebrow{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.top h1{font:700 24px/1.15 var(--f-display);letter-spacing:-.015em;text-wrap:balance;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px}
.coin-sm{min-width:30px;height:30px;padding:0 5px;border-radius:999px;background:var(--hl);color:var(--hl-ink);font:700 14px/1 var(--f-display);display:grid;place-items:center;flex:none}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:2px 0;font:600 11px/1.2 var(--f-body);color:var(--ink-3);min-width:0}
.tab .ti{width:52px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tab svg{width:21px;height:21px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ti{background:var(--hl);color:var(--hl-ink)}
.fab{position:fixed;z-index:19;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px 0 16px;border:0;border-radius:999px;background:var(--hl);color:var(--hl-ink);font:700 15px var(--f-body);display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(16,20,59,.28)}
.fab svg{width:20px;height:20px}
body.on-chat .fab{display:none}

/* cards, rows, type */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;min-width:0}
.card+.card{margin-top:0}
.stack{display:grid;gap:16px;min-width:0}
.cols{display:grid;gap:16px;min-width:0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sh h2{font:700 18px/1.2 var(--f-display);letter-spacing:-.01em}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 0}
.mut{color:var(--ink-3)}
.sm{font-size:13px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58% 92%,transparent 92%);color:inherit;padding:0 2px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;min-width:0}
.row+.row{border-top:1px solid var(--line)}
.row.btn-row{width:100%;border:0;background:none;text-align:left;padding-inline:0}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt-r{text-align:right;font:600 15px var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt-r.inc{color:var(--good)}
.cc{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--c,var(--ink-2));background:var(--surface-2);background:color-mix(in srgb,var(--c,var(--ink-2)) 14%,var(--surface))}
.cc svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-body);padding:5px 9px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.mute{background:var(--surface-2);color:var(--ink-2)}
.chip svg{width:12px;height:12px}
.pbar{position:relative;height:8px;border-radius:99px;background:var(--surface-2)}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;min-width:4px}
.pbar b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);border-radius:1px;transform:translateX(-1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;border:0;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.hl{background:var(--hl);color:var(--hl-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{height:36px;padding:0 14px;border-radius:10px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}

/* hero */
.hero{position:relative;background-color:var(--deep);color:var(--deep-ink);border-radius:var(--r-lg);overflow:hidden;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(255,255,255,.07) 31px 32px)}
.hero-main{padding:20px 20px 18px}
.hero .eyebrow{color:rgba(255,255,255,.7)}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .chip{background:rgba(255,255,255,.14);color:#fff}
.hero .chip.warn,.hero .chip.bad{background:var(--hl);color:var(--hl-ink)}
.hero-num{font:700 clamp(42px,13vw,64px)/1.02 var(--f-display);letter-spacing:-.025em;margin-top:10px;overflow-wrap:anywhere}
.hero-sub{color:rgba(255,255,255,.72);font-size:13.5px;margin-top:4px}
.hero .meter{margin-top:20px}
.hero .meter-l{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:rgba(255,255,255,.78);margin-bottom:9px}
.hero .pbar{background:rgba(255,255,255,.18)}
.hero .pbar i{background:var(--hl)}
.hero .pbar i.over{background:#FF8B93}
.hero .pbar b{background:#fff}
.stub{position:relative;border-top:2px dashed rgba(255,255,255,.3);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:16px 20px 18px;background:rgba(10,12,50,.28)}
.stub::before,.stub::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.stub::before{left:-11px}.stub::after{right:-11px}
.stub .k{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.stub .v{font:700 17px/1.2 var(--f-display);margin-top:4px;overflow-wrap:anywhere}
.stub .v.y{color:var(--hl)}

/* banner */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--ink)}
.banner p{flex:1;min-width:200px;font-size:14px}

/* charts */
.chart{position:relative}
.chart svg{width:100%;height:auto;overflow:visible;touch-action:pan-y}
.ax{font:500 10px var(--f-mono);fill:var(--ink-3)}
.gridl{stroke:var(--line);stroke-width:1}
.l-act{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.l-plan{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:5 4}
.l-prev{fill:none;stroke:var(--ink-3);stroke-width:1.5;opacity:.55}
.a-act{fill:var(--accent);opacity:.12}
.dot-end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.lbl-end{font:700 11px var(--f-body);fill:var(--ink)}
.xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:14px;height:0;border-top:2.25px solid var(--accent);display:inline-block}
.sw.plan{border-top:2px dashed var(--ink-2)}
.sw.prev{border-top:2px solid var(--ink-3);opacity:.6}
.sq{width:10px;height:10px;border-radius:3px;background:var(--c,var(--ink-3));flex:none}
.ptip,.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.45;min-width:120px;box-shadow:var(--shadow)}
.tip{position:fixed;z-index:80;min-width:0;max-width:240px}
.ptip b,.tip b{font-weight:700}
.tbl{margin-top:10px;font-size:13px}
.tbl summary{cursor:pointer;color:var(--accent);font-weight:600}
.tbl .tw{max-height:220px;margin-top:8px}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--ink-3);position:sticky;top:0;background:var(--surface)}
.share{display:flex;gap:2px;height:22px}
.share i{display:block;border-radius:4px;background:var(--c,var(--ink-3));min-width:6px}
.cat-l{display:grid;gap:2px;margin-top:12px}
.cat-l .row{padding:8px 0}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:22px}
.bars .g{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bars .pair{display:flex;align-items:flex-end;gap:3px;width:100%;flex:1;justify-content:center}
.bars .b{flex:1;max-width:34px;border-radius:5px 5px 0 0;min-height:3px;position:relative}
.bars .b.in{background:var(--c-groceries)}
.bars .b.out{background:var(--accent)}
.bars .b em{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font:500 10px var(--f-mono);font-style:normal;color:var(--ink-2);white-space:nowrap;margin-bottom:3px}
.bars .gl{font-size:12px;color:var(--ink-2)}
.wk{display:flex;align-items:flex-end;gap:8px;height:120px}
.wk .d{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0}
.wk .d i{display:block;width:100%;max-width:36px;border-radius:5px 5px 0 0;background:var(--ink-3);opacity:.5;min-height:3px}
.wk .d.max i{background:var(--accent);opacity:1}
.wk .d span{font-size:12px;color:var(--ink-2)}

/* recs */
.rec{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;align-items:start}
.rec+.rec{border-top:1px solid var(--line)}
.rec .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.rec .ic svg{width:18px;height:18px}
.rec .ic.bad{background:var(--bad-soft);color:var(--bad)}
.rec .ic.warn{background:var(--warn-soft);color:var(--warn)}
.rec .ic.good{background:var(--good-soft);color:var(--good)}
.rec .ic.info{background:var(--accent-soft);color:var(--accent)}
.rec h3{font:700 15px/1.3 var(--f-body)}
.rec p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.rec .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}

/* forms & sheets */
.lbl{display:block;font:600 11.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px}
.inp{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.inp{height:auto;padding:12px 14px;resize:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{border:0;background:none;height:38px;border-radius:10px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,20,59,.14)}
.sheetroot{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,10,36,.55);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:540px;max-height:92vh;max-height:min(92dvh,780px);overflow:auto;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(28px);opacity:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s}
.sheetroot.open .scrim{opacity:1}
.sheetroot.open .sheet{transform:none;opacity:1}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.sh-head h2{font:700 21px/1.2 var(--f-display);letter-spacing:-.01em}
.amt{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px 0 4px}
.amt input{border:0;background:none;font:700 44px/1.1 var(--f-display);width:100%;max-width:260px;text-align:center;letter-spacing:-.02em;min-width:0}
.amt input:focus{outline:none}
.amt .coin-sm{height:36px;min-width:36px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.catb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.2}
.catb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.acts-row{display:flex;gap:10px;margin-top:22px}
.acts-row .btn{flex:1}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.curlist{margin-top:12px;display:grid;gap:0}
.curlist .gh{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 0 6px}
.curb{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:8px 0;border-top:1px solid var(--line)}
.curb[aria-pressed="true"] .nm{font-weight:700}
.chk{width:18px;height:18px;color:var(--accent);flex:none}
.toast{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:var(--hl);font-weight:700;padding:0}
.inline-key{display:flex;gap:8px}

/* chat */
.msgs{display:grid;gap:14px;padding:4px 0 8px}
.m{display:flex;flex-direction:column;gap:4px;min-width:0}
.m.u{align-items:flex-end}
.m.u .b{background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:86%;overflow-wrap:anywhere;white-space:pre-wrap}
.m.a .who{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.m.a .b{background:var(--surface);border:1px solid var(--line);padding:12px 14px;border-radius:4px 18px 18px 18px;max-width:100%;overflow-wrap:anywhere}
.md p{margin:0 0 8px}.md p:last-child{margin:0}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}.md li{margin:2px 0}
.md .mh{font-weight:700}
.md code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.note{font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:10px;margin-bottom:8px}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bl 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

function sampleData(){
  var t=new Date(),txs=[],n=1;
  var bills=[
    {id:'b1',name:'Rent',amt:280,due:1,cat:'housing',kind:'bill',hist:[280,280,280],paid:{}},
    {id:'b2',name:'Electricity',amt:44,due:8,cat:'bills',kind:'bill',hist:[31,38,44],paid:{}},
    {id:'b3',name:'Home internet',amt:14,due:12,cat:'bills',kind:'bill',hist:[14,14,14],paid:{}},
    {id:'b4',name:'Mobile data',amt:8,due:15,cat:'bills',kind:'bill',hist:[8,8,8],paid:{}},
    {id:'b5',name:'Video streaming',amt:7,due:18,cat:'fun',kind:'sub',hist:[7,7,7],paid:{}},
    {id:'b6',name:'Music streaming',amt:4,due:22,cat:'fun',kind:'sub',hist:[4,4,4],paid:{}},

    {id:'b8',name:'Cloud storage',amt:3,due:27,cat:'bills',kind:'sub',hist:[3,3,3],paid:{}}
  ];
  for(var off=-2;off<=0;off++){
    var m=new Date(t.getFullYear(),t.getMonth()+off,1),y=m.getFullYear(),mo=m.getMonth(),mk=mkey(m);
    var last=off===0?t.getDate():dim(y,mo),rnd=mulberry(y*100+mo+11);
    var pick=function(a){return a[Math.floor(rnd()*a.length)]};
    var add=function(day,amt,cat,note,extra){
      if(day>last)return;
      var o={id:'s'+(n++),d:y+'-'+pad(mo+1)+'-'+pad(day),amt:+amt.toFixed(2),cat:cat,note:note,type:'exp'};
      for(var k in extra)o[k]=extra[k]; txs.push(o);
    };

      if(rnd()<(off===0?.4:.26)+(dow>=5?.12:0))add(day,5+rnd()*9,'dining',pick(['Cafe lunch','Street food','Dinner out','Coffee and snacks']));

}

  S.txs.forEach(function(x){
    var k=x.d.slice(0,7),day=+x.d.slice(8,10);
    if(x.type==='inc'){if(k===key&&day<=dd)received+=x.amt;return}
    var c=cats[x.cat]||cats.other;
    if(k===key){if(day>dd)return;spent+=x.amt;c.spent+=x.amt;cum[day]+=x.amt;if(x.billId){billSpent+=x.amt;c.billSpent+=x.amt}}
    else if(k===pk){prevSpent+=x.amt;c.prev+=x.amt;if(day<=dd){prevSD+=x.amt;c.prevSD+=x.amt}if(day<=pdays)cumPrev[day]+=x.amt}
    else if(k===p2){c.prev2+=x.amt}
  });
  for(var i=1;i<=dd;i++)cum[i]+=cum[i-1];for(i=1;i<=pdays;i++)cumPrev[i]+=cumPrev[i-1];
  var bills=S.bills.map(function(b){
    var o=Object.assign({},b);o.dueDay=Math.min(b.due,days);o.paidNow=!!(b.paid&&b.paid[key]);o.diff=o.dueDay-dd;
    o.state=o.paidNow?'paid':o.diff<0?'overdue':o.diff<=5?'soon':'later';return o;
  });
  var unpaid=0,billsByCat={};
  bills.forEach(function(b){billsByCat[b.cat]=(billsByCat[b.cat]||0)+b.amt;if(!b.paidNow){unpaid+=b.amt;if(cats[b.cat])cats[b.cat].unpaid+=b.amt}});
  var budget=sum(CATS,function(c){return cats[c.k].limit});
  function expCat(k,d){
    var lim=cats[k].limit;if(!lim)return 0;
    var bc=Math.min(lim,billsByCat[k]||0),due=sum(bills.filter(function(b){return b.cat===k&&b.dueDay<=d}),function(b){return b.amt});
    return Math.min(lim,Math.min(due,bc)+(lim-bc)*d/days);
  }
  var plan=[0];for(var d=1;d<=days;d++)plan.push(sum(CATS,function(c){return expCat(c.k,d)}));
  var expected=plan[dd],left=budget-spent,free=left-unpaid,perDay=Math.max(0,free)/daysLeft;
  var status=!budget?'none':spent>budget?'over':(spent-expected)>budget*.05?'ahead':(spent-expected)<-budget*.05?'under':'on';
  var disc=spent-billSpent,proj=spent+unpaid+(dd?disc/dd:0)*(days-dd),income=S.income,projSave=income-proj,saveRate=income?projSave/income:0;
  CATS.forEach(function(c){
    var a=cats[c.k],rate=dd?(a.spent-a.billSpent)/dd:0;
    a.proj=a.spent+a.unpaid+rate*(days-dd);
    a.exp=expCat(c.k,dd);
    a.state=!a.limit?'none':a.spent>a.limit?'over':a.spent>a.exp+a.limit*.1?'watch':'ok';
  });
  return {t:t,key:key,dd:dd,days:days,daysLeft:daysLeft,pdays:pdays,cats:cats,cum:cum,cumPrev:cumPrev,plan:plan,bills:bills,unpaid:unpaid,budget:budget,spent:spent,prevSpent:prevSpent,prevSD:prevSD,received:received,expected:expected,left:left,free:free,perDay:perDay,status:status,proj:proj,projSave:projSave,saveRate:saveRate,income:income,billSpent:billSpent,hasMonthTx:S.txs.some(function(x){return x.d.slice(0,7)===key&&x.type==='exp'})};
}

function recs(C){
  var R=[],m=function(v){return money(v,{dec:0})};
  if(!C.hasMonthTx&&!C.bills.length)return [{tone:'info',title:'Add your first expense',body:'Log spending as it happens. Patterns and savings tips show up after a few days of entries.',impact:0,q:'How should I start tracking my money?'}];
  C.bills.forEach(function(b){if(b.state==='overdue')R.push({tone:'bad',title:b.name+' is overdue',body:'It was due on the '+ord(b.dueDay)+'. Paying now avoids late fees and keeps '+m(b.amt)+' from slipping into next month.',impact:b.amt,q:'My '+b.name+' bill is overdue. What should I do?',go:'bills'})});
  CATS.forEach(function(c){
    var a=C.cats[c.k];if(!a.limit)return;
    if(a.spent>a.limit){R.push({tone:'bad',title:c.n+' is over budget',body:m(a.spent)+' spent against a '+m(a.limit)+' limit. Pause '+c.n.toLowerCase()+' for now, or raise the limit if this was a one-off.',impact:a.spent-a.limit,q:"I'm over budget on "+c.n+'. How do I recover?'});return}
    if(a.state==='watch'&&a.proj>a.limit){
      var left=a.limit-a.spent-a.unpaid,cap=Math.max(0,left)/Math.max(1,C.daysLeft);
      R.push({tone:'warn',title:c.n+' is running ahead',body:'At this pace it lands near '+m(a.proj)+', about '+m(a.proj-a.limit)+' over. Keeping it to '+m(cap)+' a day gets you back on plan.',impact:a.proj-a.limit,q:'How can I slow down my '+c.n.toLowerCase()+' spending this month?'});
    }
  });
  C.bills.forEach(function(b){
    if(b.hist&&b.hist.length>=3){
      var latest=b.hist[b.hist.length-1],prevAvg=(b.hist[b.hist.length-2]+b.hist[b.hist.length-3])/2;
      if(prevAvg>0&&latest>prevAvg*1.1)R.push({tone:'warn',title:b.name+' went up '+Math.round((latest/prevAvg-1)*100)+'%',body:'Latest bill '+m(latest)+' against a recent average of '+m(prevAvg)+'. Check usage and compare plans before the next cycle.',impact:latest-prevAvg,q:'My '+b.name+' bill rose '+Math.round((latest/prevAvg-1)*100)+'%. How can I bring it down?',go:'bills'});
    }
  });
  var subs=C.bills.filter(function(b){return b.kind==='sub'}),subTot=sum(subs,function(b){return b.amt});
  if(subs.length>=3)R.push({tone:'info',title:subs.length+' subscriptions cost '+m(subTot*12)+' a year',body:'Cancel the one you use least and you keep roughly '+m(subTot/subs.length*12)+' a year.',impact:subTot/subs.length,q:'Help me decide which subscriptions to cancel.',go:'bills'});
  var fixed=sum(C.bills,function(b){return b.amt});
  if(C.income&&fixed/C.income>.5)R.push({tone:'warn',title:'Fixed bills take '+Math.round(fixed/C.income*100)+'% of income',body:'Above half leaves little room to absorb surprises. Look at your biggest bill first.',impact:fixed-C.income*.5,q:'My fixed bills are over half my income. What can I do?'});
  if(C.income&&C.hasMonthTx){
    if(C.saveRate<.15){var gap=C.income*.2-C.projSave;R.push({tone:'warn',title:'Savings are thin this month',body:'You are on track to keep '+Math.max(0,Math.round(C.saveRate*100))+'%. Moving '+m(gap)+' to savings on payday gets you to 20%.',impact:gap,q:'How can I raise my savings rate to 20%?'})}
    else R.push({tone:'good',title:'Savings are on track',body:'You are heading for about '+Math.round(C.saveRate*100)+'% saved this month, about '+m(C.projSave)+'.',impact:0,q:'What should I do with my extra savings?'});
  }
  var sev={bad:0,warn:1,info:2,good:3};
  R.sort(function(a,b){return sev[a.tone]-sev[b.tone]||b.impact-a.impact});
  if(!R.length)R.push({tone:'good',title:'Everything looks steady',body:'Spending is tracking your plan and no bills are late.',impact:0,q:'Give me a quick summary of my month.'});
  return R;
}

/* ───────── charts ───────── */
var PACE=null;
function paceChart(C){
  var W=340,H=196,L=42,R=14,T=22,B=24,iw=W-L-R,ih=H-T-B;
  var x=function(d){return L+(C.days>1?(d-1)/(C.days-1):0)*iw};
  var maxV=Math.max(C.budget,C.cum[C.dd]||0,C.plan[C.days]||0,Math.max.apply(null,C.cumPrev),1);
  var top=niceCeil(maxV*1.04),y=function(v){return T+ih-(v/top)*ih};
  var path=function(arr,a,b){var s='';for(var d=a;d<=b;d++)s+=(d===a?'M':'L')+x(d).toFixed(1)+' '+y(arr[d]).toFixed(1)+' ';return s};
  var ticks=[0,top/2,top],xt=[1,8,15,22,C.days].filter(function(v,i,a){return v<=C.days&&a.indexOf(v)===i});
  var g='';
  ticks.forEach(function(v){g+='<line class="gridl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+cmp(v)+'</text>'});
  xt.forEach(function(d){g+='<text class="ax" x="'+x(d)+'" y="'+(H-6)+'" text-anchor="'+(d===1?'start':d===C.days?'end':'middle')+'">'+d+'</text>'});
  var ex=x(C.dd),ey=y(C.cum[C.dd]),anchor=ex>W-80?'end':'middle';
  var lastMonth=Math.min(C.pdays,C.days);
  var area=path(C.cum,1,C.dd)+'L'+x(C.dd)+' '+y(0)+' L'+x(1)+' '+y(0)+' Z';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cumulative spending this month against plan. '+money(C.spent,{dec:0})+' spent by day '+C.dd+' of '+C.days+'; plan at this point is '+money(C.expected,{dec:0})+'.">'+g+
   '<path class="l-prev" d="'+path(C.cumPrev,1,lastMonth)+'"/>'+
   '<path class="l-plan" d="'+path(C.plan,1,C.days)+'"/>'+
   '<text class="ax" x="'+(W-R)+'" y="'+(y(C.plan[C.days])-6)+'" text-anchor="end">Plan</text>'+
   (C.dd>1?'<path class="a-act" d="'+area+'"/><path class="l-act" d="'+path(C.cum,1,C.dd)+'"/>':'')+
   '<line id="pc-x" class="xh" x1="'+ex+'" x2="'+ex+'" y1="'+T+'" y2="'+(T+ih)+'" visibility="hidden"/>'+
   '<circle class="dot-end" cx="'+ex+'" cy="'+ey+'" r="5"/>'+
   '<text class="lbl-end" x="'+ex+'" y="'+(ey-11)+'" text-anchor="'+anchor+'">'+money(C.cum[C.dd],{dec:0})+'</text>'+
   '<rect id="pc-hit" x="'+L+'" y="'+T+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg>';
  PACE={W:W,L:L,R:R,T:T,ih:ih,C:C,x:x};
  var rows='';for(var d=1;d<=C.dd;d+=Math.max(1,Math.floor(C.dd/10)||1))rows+='<tr><td>'+MON[C.t.getMonth()]+' '+d+'</td><td>'+money(C.cum[d],{dec:0})+'</td><td>'+money(C.plan[d],{dec:0})+'</td><td>'+(d<=C.pdays?money(C.cumPrev[d],{dec:0}):'–')+'</td></tr>';
  return '<div class="chart" id="pace">'+svg+'<div class="ptip" id="ptip" hidden></div></div>'+
   '<div class="legend"><span><i class="sw"></i>This month</span><span><i class="sw plan"></i>Plan</span><span><i class="sw prev"></i>Last month</span></div>'+
   '<details class="tbl"><summary>View as table</summary><div class="tw"><table><thead><tr><th>Day</th><th>Spent</th><th>Plan</th><th>Last month</th></tr></thead><tbody>'+rows+'</tbody></table></div></details>';
}
function bindPace(){
  var hit=$('#pc-hit');if(!hit||!PACE)return;
  var svg=hit.ownerSVGElement,line=$('#pc-x'),tip=$('#ptip'),P=PACE,C=P.C;
  function move(ev){
    var r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*P.W;
    var d=clamp(Math.round((px-P.L)/(P.W-P.L-P.R)*(C.days-1))+1,1,C.days);
    line.setAttribute('x1',P.x(d));line.setAttribute('x2',P.x(d));line.setAttribute('visibility','visible');
    var h='<b>'+MON[C.t.getMonth()]+' '+d+'</b><br>';
    if(d<=C.dd)h+='Spent '+money(C.cum[d],{dec:0})+'<br>';
    h+='Plan '+money(C.plan[d],{dec:0});
    if(d<=C.pdays)h+='<br>Last month '+money(C.cumPrev[d],{dec:0});
    tip.innerHTML=h;tip.hidden=false;
    var pct=P.x(d)/P.W*100;tip.style.left=clamp(pct,18,82)+'%';tip.style.top='0';tip.style.transform='translateX(-50%)';
  }
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',function(){line.setAttribute('visibility','hidden');tip.hidden=true});
}
function shareBar(C){
  var list=CATS.map(function(c){return {c:c,v:C.cats[c.k].spent}}).filter(function(o){return o.v>0});
  if(!list.length)return '';
  var tot=sum(list,function(o){return o.v});
  var top=list.slice().sort(function(a,b){return b.v-a.v}).slice(0,5).map(function(o){return o.c.k});
  var segs=[],rest=0;
  list.forEach(function(o){if(top.indexOf(o.c.k)>=0)segs.push({k:o.c.k,n:o.c.n,v:o.v});else rest+=o.v});
  if(rest>0)segs.push({k:'other',n:'Everything else',v:rest,neutral:true});
  var bar='<div class="share" role="img" aria-label="Share of spending by category">'+segs.map(function(s){return '<i style="flex:'+s.v+';--c:'+(s.neutral?'var(--ink-3)':'var(--c-'+s.k+')')+'" data-tip="'+esc(s.n+' · '+money(s.v,{dec:0})+' · '+Math.round(s.v/tot*100)+'%')+'"></i>'}).join('')+'</div>';
  var rows=segs.slice().sort(function(a,b){return b.v-a.v}).map(function(s){
    return '<div class="row"><span class="sq" style="--c:'+(s.neutral?'var(--ink-3)':'var(--c-'+s.k+')')+'"></span><span class="grow ell">'+esc(s.n)+'</span><span class="mut sm num">'+Math.round(s.v/tot*100)+'%</span><span class="amt-r" style="min-width:76px">'+money(s.v,{dec:0})+'</span></div>';
  }).join('');
  return bar+'<div class="cat-l">'+rows+'</div>';
}

VIEWS.budget=function(){
  var C=calc(),needs=0,wants=0;
  CATS.forEach(function(c){if(c.g==='need')needs+=C.cats[c.k].limit;else wants+=C.cats[c.k].limit});
  var plannedSave=C.income-C.budget,pct=function(v){return C.income?Math.round(v/C.income*100):0};
  var over=C.budget>C.income;
  var split=C.income?'<div class="share" style="margin-top:14px"><i style="flex:'+needs+';--c:var(--c-housing)" data-tip="Needs · '+money(needs,{dec:0})+'"></i><i style="flex:'+wants+';--c:var(--c-dining)" data-tip="Wants · '+money(wants,{dec:0})+'"></i><i style="flex:'+Math.max(plannedSave,0)+';--c:var(--c-groceries)" data-tip="Savings · '+money(Math.max(plannedSave,0),{dec:0})+'"></i></div>'+
    '<div class="legend"><span><i class="sq" style="--c:var(--c-housing)"></i>Needs '+pct(needs)+'%</span><span><i class="sq" style="--c:var(--c-dining)"></i>Wants '+pct(wants)+'%</span><span><i class="sq" style="--c:var(--c-groceries)"></i>Savings '+Math.max(0,pct(plannedSave))+'%</span></div>':'';
  var head='<section class="card"><div class="sh"><h2>Monthly plan</h2><button class="btn sm hl" data-act="smart">Smart budget</button></div>'+
    '<div class="row" style="padding-top:0"><span class="grow mut">Income</span><span class="amt-r">'+money(C.income,{dec:0})+'</span></div>'+
    '<div class="row"><span class="grow mut">Planned spending</span><span class="amt-r">'+money(C.budget,{dec:0})+'</span></div>'+
    '<div class="row"><span class="grow mut">Planned savings</span><span class="amt-r" style="color:var(--'+(over?'bad':'good')+')">'+money(plannedSave,{dec:0})+'</span></div>'+split+
    (over?'<p class="err">Your limits add up to more than your income. Lower a few categories or try Smart budget.</p>':'')+
    '<p class="sm mut" style="margin-top:12px">A common rule is 50% needs, 30% wants, 20% savings.</p></section>';

function geminiStream(contents,onText){
  var key=S.gemini.key.trim(),model=(S.gemini.model||'gemini-2.5-flash').trim();

    if(!res.ok)return res.json().catch(function(){return {}}).then(function(j){throw GErr('http',(j.error&&j.error.message)||'Request failed',res.status)});

      buf+=s;var i;

        var line=buf.slice(0,i).replace(/\r$/,'');buf=buf.slice(i+1);
        if(line.indexOf('data:')!==0)continue;
        var js=line.slice(5).trim();if(!js||js==='[DONE]')continue;
        try{
          var j=JSON.parse(js);
          if(j.promptFeedback&&j.promptFeedback.blockReason)throw GErr('blocked','Gemini declined to answer this one ('+j.promptFeedback.blockReason+')');
          var p=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
          if(p){out+=p.map(function(x){return x.text||''}).join('');onText(out)}
        }catch(e){if(e.kind)throw e}
      }
    }
    function done(){if(!out.trim())throw GErr('empty','Gemini returned an empty reply');return out}
    if(res.body&&res.body.getReader){
      var rd=res.body.getReader(),dec=new TextDecoder();
      var pump=function(){return rd.read().then(function(r){if(r.done){feed('\n');return done()}feed(dec.decode(r.value,{stream:true}));return pump()})};
      return pump();
    }
    return res.text().then(function(t){feed(t+'\n');return done()});
  });
}
function geminiErrText(e){

function md(src){

    else{flush();h+='<p>'+inl(l)+'</p>'}
  });
  flush();return h;
}

  var head='<section class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="stat grow"><i class="dot '+(live?'on':'')+'"></i>'+(live?'Gemini · '+esc(S.gemini.model):'Built-in coach')+'</span><button class="btn sm ghost" data-act="settings" data-focus="key">'+(live?'Gemini settings':'Connect Gemini')+'</button></section>';
  var connect=live?'':'<section class="card" style="margin-top:12px"><h2 style="font:700 17px var(--f-display)">Get realistic answers with Gemini</h2><p class="sm mut" style="margin:6px 0 12px">Paste a free API key from Google AI Studio. It stays on this device and goes only to Google. Until then, the built-in coach answers from your numbers.</p><div class="inline-key"><input class="inp" id="key-quick" type="password" placeholder="Paste Gemini API key" autocomplete="off" spellcheck="false" aria-label="Gemini API key"><button class="btn" data-act="key-quick">Connect</button></div><p class="sm" style="margin-top:10px"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">Get a free key</a></p></section>';
  return '<div class="chat">'+head+connect+'<div class="msgs" id="msgs" style="margin-top:16px" aria-live="polite"></div><div class="composer"><div class="qchips">'+QUICK.map(function(q){return '<button data-act="ask" data-q="'+esc(q)+'">'+esc(q)+'</button>'}).join('')+'</div><form class="cform" data-form="chat"><textarea class="inp" id="chat-in" rows="1" placeholder="Ask about your money" aria-label="Message"></textarea><button class="send" type="submit" aria-label="Send">'+ui('send',20)+'</button></form></div></div>';
};
function drawMsgs(){
  var el=$('#msgs');if(!el)return;
  var list=S.chat.length?S.chat:[{role:'model',text:"Hi"+(S.name?' '+S.name:'')+"! I can see your budget, bills and spending. Ask me anything, like **how much can I spend today** or **where can I save**.",src:''}];
  el.innerHTML=list.map(msgHTML).join('');
}
function toBottom(){window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})}
function sendChat(text){
  text=(text||'').trim();if(!text||busy)return;busy=true;
  S.chat.push({role:'user',text:text});
  var el=$('#msgs'),holder=document.createElement('div');
  if(el){drawMsgs();el.insertAdjacentHTML('beforeend',msgHTML({role:'model',text:'',src:''}));holder=el.lastElementChild}
  toBottom();
  function finish(reply,src,note){
    S.chat.push({role:'model',text:reply,src:src,note:note||''});S.chat=S.chat.slice(-40);save();busy=false;
    if($('#msgs')){drawMsgs();toBottom()}
  }
  if(S.gemini.key){
    geminiStream(chatContents(),function(t){var b=holder.querySelector('.b');if(b){b.innerHTML=md(t);toBottom()}})
      .then(function(r){finish(r,'gemini')})
      .catch(function(e){finish(localAnswer(text),'offline',geminiErrText(e)+' Here is the built-in coach instead.')});
  }else{
    setTimeout(function(){finish(localAnswer(text),'offline')},450);
  }
}

var lastFocus=null,draft={},txDraft={},billDraft={},smartMode='503020';
function openSheet(html){
  var root=$('#sheet');lastFocus=document.activeElement;
  root.innerHTML='<div class="scrim" data-act="close"></div><section class="sheet" role="dialog" aria-modal="true">'+html+'</section>';
  root.hidden=false;document.body.classList.add('noscroll');
  requestAnimationFrame(function(){root.classList.add('open')});
  var f=root.querySelector('[autofocus]');if(f)setTimeout(function(){f.focus()},60);
}
function closeSheet(){
  var root=$('#sheet');if(root.hidden)return;
  root.classList.remove('open');root.hidden=true;root.innerHTML='';document.body.classList.remove('noscroll');
  if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))try{lastFocus.focus()}catch(e){}
}
function head(t){return '<div class="sh-head"><h2>'+t+'</h2><button type="button" class="iconbtn" data-act="close" aria-label="Close">'+ui('x',20)+'</button></div>'}
var toastT;
function toast(msg,undoFn){
  var t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(undoFn?'<button data-act="undo">Undo</button>':'');t.hidden=false;toast.undo=undoFn;
  clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},4500);
}

function saveTx(){
  var a=parseAmt($('#tx-amt').value),err=$('#tx-err');
  if(!(a>0)){err.textContent='Enter an amount greater than zero.';err.hidden=false;$('#tx-amt').focus();return}
  var d=$('#tx-date').value||ymd(new Date()),note=$('#tx-note').value.trim(),base=toBase(a);
  var rec={type:txDraft.type,amt:base,d:d,note:note,cat:txDraft.type==='inc'?'income':txDraft.cat};
  if(txDraft.id){var x=S.txs.filter(function(t){return t.id===txDraft.id})[0];Object.assign(x,rec)}
  else S.txs.push(Object.assign({id:uid()},rec));
  save();closeSheet();renderView();toast(txDraft.id?'Transaction updated':(rec.type==='inc'?'Income added':'Expense added'));
}
function delTx(){
  var x=S.txs.filter(function(t){return t.id===txDraft.id})[0];if(!x)return;
  S.txs=S.txs.filter(function(t){return t.id!==x.id});
  if(x.billId){var b=S.bills.filter(function(b){return b.id===x.billId})[0];if(b&&b.paid)delete b.paid[x.d.slice(0,7)]}
  save();closeSheet();renderView();
  toast('Transaction deleted',function(){S.txs.push(x);if(x.billId){var b=S.bills.filter(function(b){return b.id===x.billId})[0];if(b){b.paid=b.paid||{};b.paid[x.d.slice(0,7)]=true}}save();renderView()});
}

function applyPlan(limits){var prev=JSON.stringify(S.budgets);S.budgets=limits;save();return prev}
function planFor(mode){
  var out={},inc=S.income;
  if(mode==='503020'){CATS.forEach(function(c){out[c.k]=niceBase(inc*c.w/100)});return out}
  var C=calc();
  CATS.forEach(function(c){
    var a=C.cats[c.k],vals=[a.prev,a.prev2].filter(function(v){return v>0}),b=vals.length?sum(vals)/vals.length:inc*c.w/100;
    out[c.k]=niceBase(b*(c.g==='want'?0.9:1.02));
  });
  var tot=sum(CATS,function(c){return out[c.k]}),cap=inc*.8;
  if(tot>cap){var wt=sum(CATS.filter(function(c){return c.g==='want'}),function(c){return out[c.k]}),nt=tot-wt,f=Math.max(cap-nt,wt*.4)/wt;CATS.forEach(function(c){if(c.g==='want')out[c.k]=niceBase(out[c.k]*f)})}
  return out;
}
function smartHTML(){
  var p=planFor(smartMode),tot=sum(CATS,function(c){return p[c.k]}),save=S.income-tot;
  return '<div class="seg" role="group" aria-label="Plan type"><button data-act="smart-mode" data-v="503020" aria-pressed="'+(smartMode==='503020')+'">50 / 30 / 20</button><button data-act="smart-mode" data-v="habits" aria-pressed="'+(smartMode==='habits')+'">Based on my habits</button></div>'+
   '<p class="sm mut" style="margin:12px 0 6px">'+(smartMode==='503020'?'Splits your income into needs, wants and 20% savings.':'Uses your last two months of spending, with wants trimmed by 10%.')+'</p>'+
   CATS.map(function(c){return '<div class="row">'+coin(c.k)+'<span class="grow">'+c.n+'</span><span class="amt-r">'+money(p[c.k],{dec:0})+'</span></div>'}).join('')+

   '<div class="acts-row"><button class="btn" data-act="smart-apply">Apply this plan</button></div>';
}

  'budget-edit':function(el){
    var k=el.dataset.k,c=CAT[k],C=calc(),a=C.cats[k],cu=cur(S.currency);
    openSheet('<form data-form="budget" data-k="'+k+'" autocomplete="off">'+head(c.n+' limit')+'<div style="display:flex;gap:12px;align-items:center">'+coin(k)+'<div><p class="sm mut">Spent this month</p><p style="font-weight:700">'+money(a.spent,{dec:0})+'</p></div><div style="margin-left:auto;text-align:right"><p class="sm mut">Last month</p><p style="font-weight:700">'+money(a.prev,{dec:0})+'</p></div></div>'+
     '<label class="amt"><span class="coin-sm">'+esc(symShort(S.currency))+'</span><input id="bud-in" inputmode="decimal" aria-label="Monthly limit in '+S.currency+'" value="'+(a.limit?Math.round(a.limit*cu.r):'')+'" placeholder="0" autofocus></label>'+
     '<div class="qchips" style="justify-content:center;margin-top:8px"><button type="button" data-act="bud-adj" data-v="0.9">−10%</button><button type="button" data-act="bud-adj" data-v="1.1">+10%</button><button type="button" data-act="bud-last">Match last month</button></div>'+
     '<div class="acts-row"><button class="btn" type="submit">Save limit</button></div></form>');
  },
  'bud-adj':function(el){var i=$('#bud-in'),v=parseAmt(i.value)||0;i.value=Math.round(v*parseFloat(el.dataset.v))},
  'bud-last':function(){var k=$('[data-form="budget"]').dataset.k,a=calc().cats[k];$('#bud-in').value=Math.round(niceRound(a.prev*cur(S.currency).r))},
  smart:function(){smartMode='503020';openSheet(head('Smart budget')+'<div id="smart-body">'+smartHTML()+'</div>')},
  'smart-mode':function(el){smartMode=el.dataset.v;$('#smart-body').innerHTML=smartHTML()},
  'smart-apply':function(){var prev=applyPlan(planFor(smartMode));closeSheet();renderView();toast('Budget updated',function(){S.budgets=JSON.parse(prev);save();renderView()})},
  'bill-add':function(){openBill()},
  'bill-edit':function(el){openBill(el.dataset.id)},
  'bill-kind':function(el){billDraft.kind=el.dataset.v;$$('[data-act="bill-kind"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===billDraft.kind))})},
  'bill-del':function(){
    var b=S.bills.filter(function(x){return x.id===billDraft.id})[0];if(!b)return;
    S.bills=S.bills.filter(function(x){return x.id!==b.id});save();closeSheet();renderView();toast('Bill removed',function(){S.bills.push(b);save();renderView()});
  },
  'bill-pay':function(el){payBill(el.dataset.id)},
  ask:function(el){var q=el.dataset.q;if(TAB!=='chat')go('chat');setTimeout(function(){sendChat(q)},60)},
  undo:function(){if(toast.undo)toast.undo();$('#toast').hidden=true}
};
function openBill(id){
  var b=id?S.bills.filter(function(x){return x.id===id})[0]:null,k=cur(S.currency);
  billDraft={id:b?b.id:null,kind:b?b.kind:'bill'};
  openSheet('<form data-form="bill" autocomplete="off">'+head(b?'Edit bill':'Add bill')+
   '<div class="seg" role="group" aria-label="Kind"><button type="button" data-act="bill-kind" data-v="bill" aria-pressed="'+(billDraft.kind==='bill')+'">Bill</button><button type="button" data-act="bill-kind" data-v="sub" aria-pressed="'+(billDraft.kind==='sub')+'">Subscription</button></div>'+
   '<label class="lbl" for="bl-name">Name</label><input class="inp" id="bl-name" maxlength="40" placeholder="e.g. Electricity" value="'+esc(b?b.name:'')+'" autofocus>'+
   '<label class="lbl" for="bl-amt">Amount ('+S.currency+')</label><input class="inp" id="bl-amt" inputmode="decimal" placeholder="0" value="'+(b?esc(String(+(b.amt*k.r).toFixed(k.d))):'')+'">'+
   '<label class="lbl" for="bl-due">Due day of month</label><input class="inp" id="bl-due" type="number" min="1" max="31" inputmode="numeric" value="'+(b?b.due:'1')+'">'+
   '<label class="lbl" for="bl-cat">Category</label><select class="inp" id="bl-cat">'+CATS.map(function(c){return '<option value="'+c.k+'"'+((b?b.cat:'bills')===c.k?' selected':'')+'>'+c.n+'</option>'}).join('')+'</select>'+
   '<p class="err" id="bl-err" hidden></p><div class="acts-row">'+(b?'<button type="button" class="btn danger" data-act="bill-del">Delete</button>':'')+'<button class="btn" type="submit">Save</button></div></form>');
}
function payBill(id){
  var b=S.bills.filter(function(x){return x.id===id})[0];if(!b)return;
  var key=mkey(new Date());b.paid=b.paid||{};
  if(b.paid[key]){
    var gone=S.txs.filter(function(x){return x.billId===id&&x.d.slice(0,7)===key});
    S.txs=S.txs.filter(function(x){return !(x.billId===id&&x.d.slice(0,7)===key)});delete b.paid[key];save();renderView();
    toast(b.name+' marked unpaid',function(){S.txs=S.txs.concat(gone);b.paid[key]=true;save();renderView()});
  }else{
    var tx={id:uid(),d:ymd(new Date()),amt:b.amt,cat:b.cat,note:b.name,type:'exp',billId:id};
    S.txs.push(tx);b.paid[key]=true;save();renderView();
    toast(b.name+' marked paid',function(){S.txs=S.txs.filter(function(x){return x.id!==tx.id});delete b.paid[key];save();renderView()});
  }
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var f=ACT[el.dataset.act];if(f){ev.preventDefault();f(el,ev)}
});
document.addEventListener('submit',function(ev){
  var f=ev.target.closest('form');if(!f)return;ev.preventDefault();
  var kind=f.dataset.form;
  if(kind==='tx')saveTx();
  else if(kind==='chat'){var i=$('#chat-in');var v=i.value;i.value='';i.style.height='';sendChat(v)}
  else if(kind==='budget'){var v2=parseAmt($('#bud-in').value);S.budgets[f.dataset.k]=isFinite(v2)&&v2>0?toBase(v2):0;save();closeSheet();renderView();toast('Limit saved')}
  else if(kind==='bill'){
    var name=$('#bl-name').value.trim(),amt=parseAmt($('#bl-amt').value),due=parseInt($('#bl-due').value,10),err=$('#bl-err');
    if(!name||!(amt>0)||!(due>=1&&due<=31)){err.textContent='Add a name, an amount above zero and a due day from 1 to 31.';err.hidden=false;return}
    var rec={name:name,amt:toBase(amt),due:due,cat:$('#bl-cat').value,kind:billDraft.kind};
    if(billDraft.id){var b=S.bills.filter(function(x){return x.id===billDraft.id})[0];if(b.amt!==rec.amt){b.hist=(b.hist||[]).concat([rec.amt]).slice(-3)}Object.assign(b,rec)}
    else S.bills.push(Object.assign({id:uid(),paid:{},hist:[rec.amt]},rec));
    save();closeSheet();renderView();toast('Bill saved');
  }
  else if(kind==='setup'){
    var inc=parseAmt($('#su-income').value),er=$('#su-err');
    if(!(inc>0)){er.textContent='Enter your monthly income to build a budget.';er.hidden=false;return}
    S.name=draft.name||'';S.income=toBase(inc);S.sample=false;S.txs=[];S.bills=[];S.chat=[];S.budgets=planFor('503020');draft={};
    save();closeSheet();go('home');toast('All set. Add your first expense.');
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='cur-q'){$('#cur-list').innerHTML=curListHTML(t.value,curMode)}
  else if(t.id==='act-q'){actQ=t.value;$('#act-list').innerHTML=activityHTML()}
  else if(t.dataset&&t.dataset.draft){draft[t.dataset.draft]=t.value}
  else if(t.id==='chat-in'){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'}
});
document.addEventListener('change',function(ev){
  var t=ev.target,s=t.dataset&&t.dataset.set;if(!s)return;
  if(s==='name'){S.name=t.value.trim();renderTop()}
  else if(s==='income'){var v=parseAmt(t.value);if(v>0){S.income=toBase(v);renderView()}}
  else if(s==='key'){S.gemini.key=t.value.trim();if(TAB==='chat')renderView()}
  else if(s==='model'){S.gemini.model=t.value.trim()||'gemini-2.5-flash'}
  save();
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.id==='chat-in'){ev.preventDefault();var i=ev.target,v=i.value;i.value='';i.style.height='';sendChat(v)}
});
/* tooltips for bars and segments */
var tipEl=$('#tip');
function showTip(ev){
  var el=ev.target.closest&&ev.target.closest('[data-tip]');
  if(!el){tipEl.hidden=true;return}
  tipEl.textContent=el.dataset.tip;tipEl.hidden=false;
  var w=tipEl.offsetWidth,x=clamp(ev.clientX-w/2,8,window.innerWidth-w-8);
  tipEl.style.left=x+'px';tipEl.style.top=Math.max(8,ev.clientY-tipEl.offsetHeight-14)+'px';
}
document.addEventListener('pointermove',showTip);
document.addEventListener('pointerdown',showTip);
document.addEventListener('pointerleave',function(){tipEl.hidden=true});
document.addEventListener('scroll',function(){tipEl.hidden=true},{passive:true});

/* go */
load();applyTheme();renderAll();
})();
</script>

</html>
